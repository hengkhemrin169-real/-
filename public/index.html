<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="flex flex-col items-center justify-center mb-6">
            <img src="upload/pic_card.png" alt="Logo" class="h-14 w-auto object-contain mb-3">
            <h2 id="form-title" class="text-2xl font-bold text-slate-800">Welcome Back</h2>
            <p id="form-subtitle" class="text-xs text-slate-500 mt-1">Please sign in to your account</p>
        </div>

        <div id="message" class="text-sm text-center mb-4 font-medium"></div>

        <form id="auth-form" class="space-y-4">
            <!-- Image Upload Field (Hidden by default, shown on Register) -->
            <div id="image-field" class="hidden">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Profile Image</label>
                <input type="file" id="user-image" accept="image/*" 
                    class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required 
                    class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" required 
                    class="w-full px-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/20 transition duration-200 cursor-pointer">
                Login
            </button>
        </form>

        <div id="toggle-btn" class="text-center mt-6 text-sm text-slate-600 hover:text-blue-600 font-medium cursor-pointer transition" onclick="toggleMode()">
            Need an account? <span class="text-blue-600 underline">Register</span>
        </div>
    </div>

<script>
    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-btn');
        const imageField = document.getElementById('image-field');
        const msg = document.getElementById('message');
        
        msg.innerText = '';
        document.getElementById('auth-form').reset();

        if (isLogin) {
            formTitle.innerText = 'Welcome Back';
            formSubtitle.innerText = 'Please sign in to your account';
            submitBtn.innerText = 'Login';
            toggleBtn.innerHTML = `Need an account? <span class="text-blue-600 underline">Register</span>`;
            imageField.classList.add('hidden');
        } else {
            formTitle.innerText = 'Create Account';
            formSubtitle.innerText = 'Sign up to get started';
            submitBtn.innerText = 'Register';
            toggleBtn.innerHTML = `Already have an account? <span class="text-blue-600 underline">Login</span>`;
            imageField.classList.remove('hidden');
        }
    }

    document.getElementById('auth-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const imageInput = document.getElementById('user-image');
        const msg = document.getElementById('message');
        
        let users = JSON.parse(localStorage.getItem('users_db')) || [];

        if (isLogin) {
            // Login Logic
            const validUser = users.find(u => u.email === email && u.password === password);
            if (validUser) {
                localStorage.setItem('current_user', JSON.stringify(validUser));
                window.location.href = 'dashboard.html';
            } else {
                msg.className = 'text-sm text-center mb-4 font-medium text-red-500';
                msg.innerText = 'Invalid email or password!';
            }
        } else {
            // Register Logic
            if (users.some(u => u.email === email)) {
                msg.className = 'text-sm text-center mb-4 font-medium text-red-500';
                msg.innerText = 'Email already registered!';
                return;
            }

            const processRegistration = (imageUrl) => {
                const newUser = { email, password, image: imageUrl || null };
                users.push(newUser);
                
                try {
                    localStorage.setItem('users_db', JSON.stringify(users));
                    localStorage.setItem('current_user', JSON.stringify(newUser));
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    msg.className = 'text-sm text-center mb-4 font-medium text-red-500';
                    msg.innerText = 'Error: Profile image is too large! Please choose a smaller image.';
                    console.error('LocalStorage quota exceeded:', error);
                }
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 150;
                        const MAX_HEIGHT = 150;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Compress image to JPEG format with 70% quality
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        processRegistration(compressedDataUrl);
                    };
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                processRegistration(null);
            }
        }
    });
</script>
</body>
</html>
